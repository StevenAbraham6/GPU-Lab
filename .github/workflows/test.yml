name: Application checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh scripts/build-video.sh
      - run: node --check gpulab/static/app.js
      - name: Check OpenCL C syntax (does not validate a GPU)
        run: clang -x cl -cl-std=CL1.2 -fsyntax-only gpulab/kernels/core.cl
