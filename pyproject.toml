[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-lab"
version = "0.1.0"
description = "Auditable multi-vendor GPU benchmarking, telemetry, and reports"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "reportlab>=4.2,<5"]

[project.optional-dependencies]
opencl = ["pyopencl>=2024.1"]
dev = ["pytest>=8"]

[project.scripts]
gpu-lab = "gpulab.cli:main"

[tool.setuptools.packages.find]
include = ["gpulab*"]

[tool.setuptools.package-data]
gpulab = ["static/*", "kernels/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
